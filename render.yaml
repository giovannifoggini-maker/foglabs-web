# Render Blueprint for the Node backend and PostgreSQL database. Review database retention/pricing in your Render dashboard.
services:
  - type: web
    name: foglabs-web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: foglabs-db
          property: connectionString
      - key: VIP_EMAIL_CODE
        sync: false
databases:
  - name: foglabs-db
    databaseName: foglabs
    user: foglabs
    plan: free
