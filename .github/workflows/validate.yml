name: Validate VYBEX

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Check JavaScript syntax
        run: npm run check

      - name: Run smoke tests
        run: npm test
